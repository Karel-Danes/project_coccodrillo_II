<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Coccodrillo-II</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07080a;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        touch-action: none;
      }

      #game canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }

      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #07080a;
        color: #d7c8a8;
        font-family: monospace;
        font-size: 20px;
        line-height: 1.5;
        text-align: center;
      }

      #rotate-hint span {
        color: #6a7785;
        font-size: 14px;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">
      <div>↻<br />Rotate your device</div>
      <span>Coccodrillo-II is played in landscape</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
